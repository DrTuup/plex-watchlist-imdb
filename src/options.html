<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plex Watchlist Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Plex Watchlist Settings</h1>
      <p id="account" class="muted">Not signed in.</p>
      <div class="row">
        <button type="button" id="signin">Sign in with Plex</button>
        <button type="button" id="signout" hidden>Sign out</button>
      </div>
      <p class="muted">
        Opens Plex's sign-in page in a new tab. Approve the request there, then come back to this page.
        The token is stored locally in Firefox and is never synced.
      </p>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
